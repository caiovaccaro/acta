name: Adversarial Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  adversarial-review:
    name: adversarial-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run bounded adversarial review
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ADVERSARIAL_MODEL: ${{ vars.OPENAI_ADVERSARIAL_MODEL || 'gpt-4.1-mini' }}
        run: node scripts/governance/run-adversarial-review.mjs
