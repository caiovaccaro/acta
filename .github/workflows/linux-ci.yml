name: Linux CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-ci:
    name: linux-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://acta:acta_test_password@127.0.0.1:5432/acta_test?schema=public
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acta
          POSTGRES_PASSWORD: acta_test_password
          POSTGRES_DB: acta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acta -d acta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production configuration contract
        env:
          NODE_ENV: production
          ADMIN_EMAIL: admin@example.invalid
          ADMIN_PASSWORD: synthetic-password-123
          ADMIN_SESSION_SECRET: synthetic-session-secret-1234567890
        run: npm run config:validate:production

      - name: Run unit verification
        run: npm run test:p1-01:unit

      - name: Run integration verification
        run: npm run test:p1-01:integration

      - name: Run end-to-end verification
        run: npm run test:p1-01:e2e

      - name: Verify production database safety contract
        run: npm run test:p1-04:unit

      - name: Verify logical backup and disposable restore
        run: npm run test:p1-04:integration

      - name: Verify Vercel data-check fixtures
        run: npm run test:p1-04:e2e

      - name: Run established regression verification
        run: npm run test:p1-01:regression

      - name: Run bounded crawler unit verification
        run: npm run test:p1-02:unit

      - name: Run bounded crawler integration verification
        run: npm run test:p1-02:integration

      - name: Run bounded crawler end-to-end verification
        run: npm run test:p1-02:e2e

      - name: Run bounded crawler regression verification
        run: npm run test:p1-02:regression

      - name: Run CAI-245 regression verification
        run: npm run test:p1-04:regression

      - name: Verify pipeline coordination migrations
        run: npm run test:p1-05:migrations

      - name: Run pipeline coordination unit verification
        run: npm run test:p1-05:unit

      - name: Run pipeline coordination integration verification
        run: npm run test:p1-05:integration

      - name: Run pipeline coordination end-to-end verification
        run: npm run test:p1-05:e2e

      - name: Run stable cursor unit verification
        run: npm run test:p1-06:unit

      - name: Run stable cursor integration verification
        run: npm run test:p1-06:integration

      - name: Run stable cursor end-to-end verification
        run: npm run test:p1-06:e2e

      - name: Run pipeline slice unit verification
        run: npm run test:p1-07:unit

      - name: Run pipeline slice integration verification
        run: npm run test:p1-07:integration

      - name: Run pipeline slice end-to-end verification
        run: npm run test:p1-07:e2e

      - name: Run LLM usage ledger unit verification
        run: npm run test:p1-08:unit

      - name: Run LLM usage ledger integration verification
        run: npm run test:p1-08:integration

      - name: Run LLM usage ledger end-to-end verification
        run: npm run test:p1-08:e2e

      - name: Run LLM budget reservation unit verification
        run: npm run test:p1-09:unit

      - name: Run LLM budget reservation integration verification
        run: npm run test:p1-09:integration

      - name: Run LLM budget reservation end-to-end verification
        run: npm run test:p1-09:e2e
