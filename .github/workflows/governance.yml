name: Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read pull-request references
        id: refs
        run: node scripts/governance/extract-pr-references.mjs

      - name: Verify specification and tests
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: >-
          npm run verify:pr-ready --
          --issue=${{ steps.refs.outputs.issue }}
          --change=${{ steps.refs.outputs.change }}

      - name: Upload commit-bound report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-${{ github.event.pull_request.head.sha }}
          path: governance-reports/
          if-no-files-found: error
          retention-days: 14
